name: Refresh fleet snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: translink-fleet
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Refresh route names and lines
        run: python3 scripts/refresh_network.py
      - name: Refresh the fleet capture
        env:
          TRANSLINK_API_KEY: ${{ vars.TRANSLINK_API_KEY || secrets.TRANSLINK_API_KEY }}
        run: python3 scripts/refresh.py
      - name: Test
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -v
      - name: Build
        run: python3 scripts/build.py
      - name: Commit the validated snapshot and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- web/data; then
            git add web/data
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh fleet snapshot'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
